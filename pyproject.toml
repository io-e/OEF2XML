[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oef2xml"
version = "0.1.0"
description = "Convert WIMS OEF exercise files into XML programs (urn:eleda:program:v1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["lxml>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
oef2xml = "oef2xml.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oef2xml = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
